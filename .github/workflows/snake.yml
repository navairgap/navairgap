name: Generate contribution snake

# Avoid overlapping runs racing to update the generated SVG files.
concurrency:
  group: contribution-snake-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: navairgap
          outputs: |
            dist/github-snake-yellow.svg?color_snake=#d8a900&color_dots=#f5f0d8,#f3d971,#e8c22e,#c99f00,#7a5e00
            dist/github-snake-yellow-dark.svg?palette=github-dark&color_snake=#ffcf00&color_dots=#0c0c0c,#493700,#806000,#bb8e00,#ffcf00

      - name: Push generated snake
        uses: EndBug/add-and-commit@v9
        with:
          add: "dist"
          message: "chore: regenerate contribution snake"
          default_author: github_actions
