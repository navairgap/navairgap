name: Profile README checks

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "assets/**"
      - "dist/**"
      - "profile-3d-contrib/**"
      - "scripts/check-profile-readme.mjs"
      - ".github/workflows/profile-readme.yml"
  pull_request:
    paths:
      - "README.md"
      - "assets/**"
      - "dist/**"
      - "profile-3d-contrib/**"
      - "scripts/check-profile-readme.mjs"
      - ".github/workflows/profile-readme.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check profile artwork and image accessibility
        run: node scripts/check-profile-readme.mjs
