<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
<title id="title">Navairgap — security engineering</title>
<desc id="desc">Animated banner: untrusted network traffic flows toward a physical air gap and is stopped, while an isolated internal network stays alive on the other side. Defensive security, network visibility, Linux.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07110c"/><stop offset="1" stop-color="#030604"/></linearGradient>
<radialGradient id="vg" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
<linearGradient id="tail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00ff88" stop-opacity="0"/><stop offset="1" stop-color="#00ff88" stop-opacity=".9"/></linearGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .3  0 0 0 0 1  0 0 0 0 .6  .16 0 0 0 0"/></filter>
<filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
<clipPath id="frame"><rect x="1" y="1" width="1198" height="268" rx="15"/></clipPath>
<clipPath id="tc1"><rect class="t1" x="52" y="191" width="0" height="24"/></clipPath><clipPath id="tc2"><rect class="t2" x="52" y="221" width="0" height="23"/></clipPath>
</defs>
<style>@keyframes t1{from{width:0}to{width:277.2px}}.t1{animation:t1 1.3s steps(33,end) 3.2s forwards}@keyframes t2{from{width:0}to{width:421.2px}}.t2{animation:t2 2.6s steps(54,end) 4.7s forwards}.ma{animation-duration:3.4s}.mb{animation-duration:4.6s}.mc{animation-duration:6.0s}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.tt{fill:#00ff88;fill-opacity:0;stroke:#00ff88;stroke-width:1.1;stroke-dasharray:700;stroke-dashoffset:700;
    animation:draw 2.4s .3s cubic-bezier(.6,0,.2,1) forwards,fillin .9s 2.1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill-opacity:1;stroke-opacity:0}}
.ms{opacity:0;animation:fadeTo .9s 2.5s ease forwards}
.gl{opacity:0;animation:fadeTo1 1.2s 2.3s ease forwards}
@keyframes fadeTo{to{opacity:.24}}
@keyframes fadeTo1{to{opacity:.3}}
.sub{opacity:0;animation:fadeIn .9s 2.6s ease forwards}
@keyframes fadeIn{to{opacity:1}}
.cur{fill:#4a8e69;animation:bl 1s steps(1) infinite}
@keyframes bl{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}
.mv{animation-name:mv;animation-timing-function:linear;animation-iteration-count:infinite;opacity:0}
@keyframes mv{0%{transform:translateX(0);opacity:0}8%{opacity:1}88%{transform:translateX(256px);opacity:1}96%,100%{transform:translateX(256px);opacity:0}}
.fl{animation-name:fl;animation-timing-function:ease-out;animation-iteration-count:infinite;opacity:0;transform-box:fill-box;transform-origin:center}
@keyframes fl{0%,87%{opacity:0;transform:scale(.3)}89%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(3.4)}}
.air{animation-name:rise;animation-timing-function:linear;animation-iteration-count:infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.6}85%{opacity:.5}100%{transform:translateY(-150px);opacity:0}}
.np{animation:np 5s ease-in-out infinite}
@keyframes np{0%,100%{stroke-opacity:.3}50%{stroke-opacity:1}}
.dot{animation:bl 1.6s steps(1) infinite}
.wall{stroke-dasharray:3 5;animation:dash 2.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-16}}
</style>

<rect x="1" y="1" width="1198" height="268" rx="15" fill="url(#bg)"/>
<g clip-path="url(#frame)">
  <rect width="1200" height="270" filter="url(#grain)" opacity=".5"/>
  <rect width="1200" height="270" fill="url(#vg)"/>
</g>
