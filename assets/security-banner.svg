<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Navairgap — security engineering</title>
  <desc id="desc">Dark terminal banner with neon green typography, highlighting defensive security, systems, and network visibility.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110c"/>
      <stop offset="1" stop-color="#030604"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00ff88" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="268" rx="15" fill="url(#bg)" stroke="#00ff88" stroke-opacity=".55" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="266" rx="14" fill="url(#grid)"/>
  <path d="M 18 70 H 1182" stroke="#00ff88" stroke-opacity=".25" />
  <circle cx="28" cy="27" r="5" fill="#ff5f57"/>
  <circle cx="47" cy="27" r="5" fill="#febc2e"/>
  <circle cx="66" cy="27" r="5" fill="#28c840"/>
  <text x="92" y="32" fill="#7fa892" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">navairgap@github: ~/profile</text>
  <text x="50" y="130" fill="#00ff88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="49" font-weight="700" letter-spacing="3">NAVAIRGAP</text>
  <text x="52" y="166" fill="#b6ffd9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">SECURITY ENGINEERING  /  NETWORK VISIBILITY  /  LINUX</text>
  <text x="52" y="207" fill="#6fe6a5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">$ build • test • inspect • defend</text>
  <text x="52" y="239" fill="#4a8e69" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"># practical tools. safe defaults. evidence over hype.</text>
  <rect x="895" y="95" width="255" height="122" rx="8" fill="#07180e" stroke="#00ff88" stroke-opacity=".45"/>
  <text x="918" y="124" fill="#63ac83" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">PROFILE_STATUS</text>
  <text x="918" y="153" fill="#00ff88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">[ ACTIVE ]</text>
  <text x="918" y="182" fill="#b6ffd9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">mode: defensive</text>
  <text x="918" y="202" fill="#b6ffd9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">scope: authorized</text>
</svg>